# Black/white glass, same values as wofi/style.css and labwc's
# themerc-override. kitty colors are plain #rrggbb (no alpha); window
# translucency comes from background_opacity instead. No blur: labwc
# doesn't do it (see quickshell/shell.qml).
#
# Reload a running kitty with ctrl+shift+f5 or `pkill -USR1 -x kitty`.

font_family      CommitMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11

background            #000000
foreground            #ffffff
background_opacity    0.9
dynamic_background_opacity yes

cursor                #ffffff
cursor_text_color     #000000
cursor_shape          block
cursor_blink_interval 0

selection_background  #ffffff
selection_foreground  #000000
url_color             #ffffff
url_style             single

# ANSI palette is left at kitty's defaults so ls/git/etc. stay readable.

window_padding_width  8
active_border_color   #ffffff
inactive_border_color #404040
inactive_text_alpha   0.5

# tab bar: hairline glass, active tab inverted like the bar's taskbar
tab_bar_style           separator
tab_separator           " "
tab_bar_margin_height   4 0
active_tab_background   #ffffff
active_tab_foreground   #000000
active_tab_font_style   normal
inactive_tab_background #000000
inactive_tab_foreground #808080
tab_bar_background      none

enable_audio_bell    no
confirm_os_window_close 0
