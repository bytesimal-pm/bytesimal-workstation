<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Thai: make TH Sarabun New the fallback used for Thai glyphs no matter
  which family the app asked for and no matter the page/UI language.

  Chromium/Electron (Discord) does per-character fallback with a pattern
  that has *no* family and lang = page language (en), so rules keyed on
  lang=th never fire. Appending TH Sarabun New with a weak binding keeps
  the app's requested font for Latin, but wins over FreeSerif / Noto Sans
  Thai when a Thai character needs a fallback.
-->
<fontconfig>
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>TH Sarabun New</string>
    </edit>
  </match>

  <!-- Emoji: route the "emoji" generic and any missing-emoji fallback to Noto Color Emoji -->
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <match target="pattern">
    <edit name="family" mode="append" binding="weak">
      <string>Noto Color Emoji</string>
    </edit>
  </match>
</fontconfig>
