<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Use TH Sarabun New only for Thai-language text, on top of whatever
  font is already requested. English/Latin text is untouched.
-->
<fontconfig>
  <match target="pattern">
    <test name="lang">
      <string>th</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>TH Sarabun New</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>th</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>TH Sarabun New</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang">
      <string>th</string>
    </test>
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>TH Sarabun New</string>
    </edit>
  </match>
</fontconfig>
